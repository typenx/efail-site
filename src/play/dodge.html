     game into one self-contained page. It runs the game's own pure

  #status { color: var(--dim); }
  button { font: inherit; color: var(--fg); background: #161a22; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--dim); }

</style>
